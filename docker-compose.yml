name: cloudynode
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "2155:8000"
    volumes:
      - ./data:/app/data
      - .downloads:/app/downloads
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "2156:3000"
    volumes:
      - ./frontend:/app
    depends_on:
      - backend
