name: cloudynode
services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "2155:2155"
    volumes:
      - ./data:/app/data
      - ./downloads:/app/downloads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2155/health"]
      interval: 30s
      timeout: 10s
      retries: 3
